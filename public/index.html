<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070b12">
  <title>T-Invest Pulse</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="phone" id="pulse">
    <header class="top">
      <div><div class="brand">TInvest <span>Pulse</span></div><div class="sub">Инвестиционный портфель</div></div>
      <button id="pulseBtn" class="pulseBtn">PULSE</button>
    </header>

    <section class="hero card">
      <div class="eyebrow">СТОИМОСТЬ ПОРТФЕЛЯ</div>
      <div class="value" id="value">Загрузка…</div>
      <div class="gain" id="gain">—</div>
      <div class="dates" id="dates">История загружается…</div>
    </section>

    <section class="grid2">
      <div class="mini card"><span>ПРИБЫЛЬ</span><b id="profit">—</b></div>
      <div class="mini card"><span>ДОХОДНОСТЬ</span><b id="profitPct">—</b></div>
      <div class="mini card"><span>CAGR</span><b id="cagr">—</b></div>
      <div class="mini card"><span>XIRR</span><b id="xirr">—</b></div>
    </section>

    <section class="chartCard card">
      <div class="chartTitle">РОСТ ПОРТФЕЛЯ <small>vs IMOEX</small></div>
      <div class="chartWrap"><canvas id="chart"></canvas><div class="chartEmpty" id="chartEmpty">Загружаю историю…</div></div>
      <div class="legend"><i></i> Портфель <em></em> IMOEX</div>
    </section>

    <section class="bottomGrid">
      <div class="income card"><div class="eyebrow">ПАССИВНЫЙ ДОХОД</div><small>без пополнений</small><div><b id="monthly">—</b><span> / месяц</span></div><div><b id="annual">—</b><span> / год</span></div></div>
      <div class="leaders card"><div class="eyebrow">ЛИДЕРЫ</div><div class="lead"><span>🟢</span><div><small>GAINER</small><b id="gainer">—</b></div></div><div class="lead"><span>🔴</span><div><small>LOSER</small><b id="loser">—</b></div></div></div>
    </section>

    <footer><span id="status">Подключение…</span><span id="updated">—</span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
