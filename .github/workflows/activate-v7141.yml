name: activate v7.14.1
on:
  push:
    paths: ['.github/workflows/activate-v7141.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check public/v714.js
          python3 - <<'PY'
          p='public/index.html';s=open(p,encoding='utf-8').read();old='/v714.js?v=7.14.0';new='/v714.js?v=7.14.1';assert old in s;s=s.replace(old,new,1);open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.14.1 cache bust'
          git push