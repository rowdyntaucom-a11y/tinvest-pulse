name: DNA clean polish v14.25.0
on:
  push:
    branches: [dna-clean-polish-v14250]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-clean-polish-v14250
      - name: Wire clean polish pass
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.24.0 — DNA DETAIL READABILITY: brighter underground, cleaner material detail and contrast; finance/history unchanged.','// v14.25.0 — DNA CLEAN POLISH: remove technical arcs, improve spacing and grounded mine detail; finance/history unchanged.')
          s=s.replace('?rev=14240','?rev=14250')
          s=s.replace("const V='v14.24.0'","const V='v14.25.0'")
          s=s.replace("DETAIL READABILITY · '+V+' · 11/11","CLEAN POLISH · '+V+' · 11/11")
          s=s.replace("/GAME ASSETS|FOUNDATION WORKS|DNA ART|RESOURCES|MINEWORKS|CLEAN ART|ART REBUILD/i","/GAME ASSETS|FOUNDATION WORKS|DNA ART|RESOURCES|MINEWORKS|CLEAN ART|ART REBUILD|DETAIL READABILITY|CINEMATIC ENV|CLEAN POLISH/i")
          s=s.replace("process.env.TINVEST_BUILD='14.24.0'","process.env.TINVEST_BUILD='14.25.0'")
          s=s.replace("version:'14.24.0',build:'14.24.0',source:'figma-detail-readability'","version:'14.25.0',build:'14.25.0',source:'figma-clean-polish'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text()
          x=x.replace("window.DNA_ART_PACK.version='14.24.0'","window.DNA_ART_PACK.version='14.25.0'")
          x=x.replace("window.DNA_ART_PACK.source='figma-detail-readability'","window.DNA_ART_PACK.source='figma-clean-polish'")
          x=x.replace("window.DNA_ART_PACK.detailOverlay='/assets/dna-world/l1/detail-readability-v14240.svg?rev=14240';","window.DNA_ART_PACK.detailOverlay='/assets/dna-world/l1/clean-polish-v14250.svg?rev=14250';")
          a.write_text(x)

          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.24.0'","const VERSION='14.25.0'"); g.write_text(x)

          e=Path('public/dna-world-engine-v141.js'); x=e.read_text()
          x=x.replace("const V='14.24.0'","const V='14.25.0'")
          x=x.replace("'/assets/dna-world/l1/detail-readability-v14240.svg?rev=14240'","'/assets/dna-world/l1/clean-polish-v14250.svg?rev=14250'")
          x=x.replace("opacity:'.86'","opacity:'.72'")
          x=x.replace("DETAIL READABILITY · v'+V+' · 11/11","CLEAN POLISH · v'+V+' · 11/11")
          e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text()
          x=x.replace("const V='14.24.0'","const V='14.25.0'")
          x=x.replace("worker('minerMine',318,365,78,112,false,1,mineBob,Math.sin(t*5.2)*.035);spark(292,328,t,0);","worker('minerMine',286,365,78,112,false,1,mineBob,Math.sin(t*5.2)*.035);spark(260,328,t,0);")
          x=x.replace("worker('builderWork',600,365,76,110,false,1,Math.sin(t*4.4+1)*1.3,-Math.sin(t*4.4+1)*.022);spark(626,321,t,1.2,'255,170,82');","worker('builderWork',650,365,76,110,false,1,Math.sin(t*4.4+1)*1.3,-Math.sin(t*4.4+1)*.022);spark(676,321,t,1.2,'255,170,82');")
          x=x.replace("const run=(t*(13+level*.9))%360,hx=170+run;","const run=(t*(13+level*.9))%150,hx=390+run;")
          x=x.replace("if(level>=3)worker('operatorIdle',472,365,73,106,false,.99,Math.sin(t*2.5)*.8,Math.sin(t*2.5)*.008);","if(level>=3)worker('operatorIdle',725,365,73,106,true,.99,Math.sin(t*2.5)*.8,Math.sin(t*2.5)*.008);")
          r.write_text(x)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/dna-art-scene-v148.js public/dna-game-assets-v147.js public/dna-world-engine-v141.js public/dna-world-runtime-v14180.js
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA clean polish v14.25.0"
          git push origin HEAD:dna-clean-polish-v14250
