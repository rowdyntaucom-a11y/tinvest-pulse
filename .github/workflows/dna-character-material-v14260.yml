name: DNA character material v14.26.0
on:
  push:
    branches: [dna-character-material-v14260]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-character-material-v14260
      - name: Wire character material pass
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.25.0 — DNA CLEAN POLISH: remove technical arcs, improve spacing and grounded mine detail; finance/history unchanged.','// v14.26.0 — DNA CHARACTER MATERIAL: richer modular workers and carts, denser underground life; finance/history unchanged.')
          s=s.replace('?rev=14250','?rev=14260')
          s=s.replace("const V='v14.25.0'","const V='v14.26.0'")
          s=s.replace("CLEAN POLISH · '+V+' · 11/11","CHARACTER MATERIAL · '+V+' · 11/11")
          s=s.replace("|CLEAN POLISH/i","|CLEAN POLISH|CHARACTER MATERIAL/i")
          s=s.replace("process.env.TINVEST_BUILD='14.25.0'","process.env.TINVEST_BUILD='14.26.0'")
          s=s.replace("version:'14.25.0',build:'14.25.0',source:'figma-clean-polish'","version:'14.26.0',build:'14.26.0',source:'character-material'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text()
          x=x.replace("window.DNA_ART_PACK.version='14.25.0'","window.DNA_ART_PACK.version='14.26.0'")
          x=x.replace("window.DNA_ART_PACK.source='figma-clean-polish'","window.DNA_ART_PACK.source='character-material'")
          a.write_text(x)

          e=Path('public/dna-world-engine-v141.js'); x=e.read_text()
          x=x.replace("const V='14.25.0'","const V='14.26.0'")
          x=x.replace("CLEAN POLISH · v'+V+' · 11/11","CHARACTER MATERIAL · v'+V+' · 11/11")
          e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text()
          x=x.replace("const V='14.25.0'","const V='14.26.0'")
          x=x.replace("const w=80*scale,h=54*scale","const w=88*scale,h=58*scale")
          x=x.replace("worker('minerMine',166,636,70,103,true,.97,Math.sin(t*5+2)*1.6,-Math.sin(t*5+2)*.03);spark(193,598,t,2.1,'74,241,226');","worker('minerMine',154,636,76,108,true,.98,Math.sin(t*5+2)*1.6,-Math.sin(t*5+2)*.03);spark(185,598,t,2.1,'74,241,226');\n   worker('operatorIdle',555,636,70,101,false,.93,Math.sin(t*2.15+1)*.7,0);")
          x=x.replace("workers:4+(level>=3)+(level>=4)+(level>=6)+(level>=8)","workers:5+(level>=3)+(level>=4)+(level>=6)+(level>=8)")
          r.write_text(x)
          PY
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-character-material-v14260.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA character material v14.26.0"
          git push origin HEAD:dna-character-material-v14260
