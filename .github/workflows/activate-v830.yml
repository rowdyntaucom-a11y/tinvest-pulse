name: activate v8.3 cinematic 2D world
on:
  push:
    paths:
      - '.github/workflows/activate-v830.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          if '/v830.js?v=8.3.0' in s:
              print('already active')
              raise SystemExit(0)
          needle='<script src="/v820.js?v=8.2.0"></script>'
          if needle not in s:
              raise SystemExit('v820 needle not found')
          s=s.replace(needle,needle+'<script src="/v830.js?v=8.3.0"></script>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "activate v8.3 cinematic 2D world"
          git push