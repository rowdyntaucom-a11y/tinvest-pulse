name: DNA level worlds responsive v14.30.0
on:
  push:
    branches: [dna-level-worlds-responsive-v14300]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-level-worlds-responsive-v14300
      - name: Wire v14.30 production
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.29.0 — DNA WORLD SCALE + LEVEL PREVIEW: global horizon, distant city/bridge and safe 1-11 preview controls; finance/history unchanged.','// v14.30.0 — DNA LEVEL WORLDS + RESPONSIVE: true visual world growth across 1-11 plus desktop-safe proportional layout; finance/history unchanged.')
          s=s.replace('|dna-level-preview-v14290)', '|dna-level-preview-v14290|dna-level-worlds-v14300)')
          s=s.replace('?rev=14290','?rev=14300')
          s=s.replace("preview='<script src=\"/dna-level-preview-v14290.js?rev=14300\"></script>'", "preview='<script src=\"/dna-level-preview-v14290.js?rev=14300\"></script>',levelworld='<script src=\"/dna-level-worlds-v14300.js?rev=14300\"></script>'")
          s=s.replace("history+art+assets+dna+runtime+preview+versionLock+'</body>'", "history+art+assets+dna+runtime+preview+levelworld+versionLock+'</body>'")
          s=s.replace("const V='v14.29.0'","const V='v14.30.0'")
          s=s.replace("WORLD SCALE · '+V+' · 11/11","LEVEL WORLDS · '+V+' · 11/11")
          s=s.replace("|WORLD SCALE/i","|WORLD SCALE|LEVEL WORLDS/i")
          s=s.replace("process.env.TINVEST_BUILD='14.29.0'","process.env.TINVEST_BUILD='14.30.0'")
          s=s.replace("version:'14.29.0',build:'14.29.0',source:'world-scale'","version:'14.30.0',build:'14.30.0',source:'level-worlds-responsive'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text().replace("window.DNA_ART_PACK.version='14.29.0'","window.DNA_ART_PACK.version='14.30.0'").replace("window.DNA_ART_PACK.source='world-scale'","window.DNA_ART_PACK.source='level-worlds-responsive'"); a.write_text(x)
          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.29.0'","const VERSION='14.30.0'"); g.write_text(x)
          e=Path('public/dna-world-engine-v141.js'); x=e.read_text().replace("const V='14.29.0'","const V='14.30.0'").replace("WORLD SCALE · v'+V+' · 11/11","LEVEL WORLDS · v'+V+' · 11/11"); e.write_text(x)
          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text().replace("const V='14.29.0'","const V='14.30.0'"); r.write_text(x)
          q=Path('public/dna-level-preview-v14290.js'); x=q.read_text().replace("const V='14.29.0'","const V='14.30.0'"); q.write_text(x)
          PY
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-level-worlds-responsive-v14300.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA level worlds responsive v14.30.0"
          git push origin HEAD:dna-level-worlds-responsive-v14300
