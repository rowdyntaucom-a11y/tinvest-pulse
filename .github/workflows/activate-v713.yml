name: activate v7.13 analytics 2.0
on:
  push:
    paths: ['.github/workflows/activate-v713.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          p='public/index.html';s=open(p,encoding='utf-8').read();needle='<script src="/v712.js?v=7.12.5"></script>';add=needle+'<script src="/v713.js?v=7.13.0"></script>';assert needle in s
          if '/v713.js?v=7.13.0' not in s:s=s.replace(needle,add,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          node --check public/v713.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.13 activate analytics 2.0'
          git push