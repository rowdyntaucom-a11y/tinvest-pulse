name: DNA world master v15.0.0
on:
  push:
    branches: [dna-world-master-v1500]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-world-master-v1500
      - name: Wire v15 world master
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.31.0 — DNA LEVEL WORLDS + RESPONSIVE: true visual world growth across 1-11 plus desktop-safe proportional layout; finance/history unchanged.','// v15.0.0 — DNA WORLD MASTER: panoramic world architecture, true territorial progression and desktop/mobile proportional layout; finance/history unchanged.')
          s=s.replace('dna-level-worlds-v14310)\\.js','dna-level-worlds-v14310|dna-world-master-v150)\\.js')
          s=s.replace("levelworld='<script src=\"/dna-level-worlds-v14310.js?rev=14310\"></script>',history=", "levelworld='<script src=\"/dna-level-worlds-v14310.js?rev=1500\"></script>',master='<script src=\"/dna-world-master-v150.js?rev=1500\"></script>',history=")
          s=s.replace("history+art+assets+dna+runtime+preview+levelworld+versionLock+'</body>'", "history+art+assets+dna+runtime+preview+levelworld+master+versionLock+'</body>'")
          s=s.replace("const V='v14.31.0'", "const V='v15.0.0'")
          s=s.replace("|LEVEL WORLDS/i", "|LEVEL WORLDS|WORLD MASTER/i")
          s=s.replace("b.innerHTML='<i></i> LEVEL WORLDS · '+V+' · 11/11'", "b.innerHTML='<i></i> WORLD MASTER · '+V+' · 11/11'")
          s=s.replace("process.env.TINVEST_BUILD='14.31.0'", "process.env.TINVEST_BUILD='15.0.0'")
          s=s.replace("version:'14.30.0',build:'14.30.0',source:'level-worlds-responsive'", "version:'15.0.0',build:'15.0.0',source:'world-master-panorama'")
          p.write_text(s)
          PY
          node --check server.js
          node --check public/dna-world-master-v150.js
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-world-master-v1500.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA world master v15.0.0"
          git push origin HEAD:dna-world-master-v1500
