name: v3 build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v3/**'
      - 'QVANIX_V3_DIRECTION.md'
      - '.github/workflows/v3-build.yml'
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - 'QVANIX_V3_DIRECTION.md'
      - '.github/workflows/v3-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Run npm test
        shell: bash
        run: |
          set +e
          npm test > /tmp/v3-test.log 2>&1
          code=$?
          echo '### v3 test tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/v3-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/v3-test.log
          exit $code
