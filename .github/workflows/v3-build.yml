name: v3 build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v3/**'
      - 'QVANIX_V3_DIRECTION.md'
      - '.github/workflows/v3-build.yml'
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - 'QVANIX_V3_DIRECTION.md'
      - '.github/workflows/v3-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
