name: Cache bust v7.9.8 semantic hints
'on':
  push:
    paths:
      - '.github/workflows/cachebust-v798.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump semantic hint script URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          old='/v797.js?v=7.9.7'; new='/v797.js?v=7.9.8'
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('v797 script tag not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.9.8 cache bust semantic percentage hints' || exit 0
          git push
