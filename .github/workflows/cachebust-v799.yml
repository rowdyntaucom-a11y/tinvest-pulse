name: Deploy v7.9.9 semantic hint fix
'on':
  push:
    paths:
      - '.github/workflows/cachebust-v799.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump semantic hint script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          old='/v797.js?v=7.9.8'; new='/v797.js?v=7.9.9'
          if old in s: p.write_text(s.replace(old,new,1))
          elif new not in s: raise SystemExit('v797 script tag not found')
          PY
          node --check public/v797.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html public/v797.js
          git commit -m 'v7.9.9 stabilize semantic percentage hints' || exit 0
          git push
