name: DNA character life v14.22.0
on:
  push:
    branches: [dna-character-life-v14220]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-character-life-v14220
      - name: Wire character life pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.21.0 — DNA DEPTH MATERIAL: cleaner layers + stronger material/readability pass; finance/history unchanged.','// v14.22.0 — DNA CHARACTER LIFE: detailed Figma sprites + visible work cycles + livelier mine; finance/history unchanged.')
          s=s.replace('?rev=14210','?rev=14220')
          s=s.replace("const V='v14.21.0'","const V='v14.22.0'")
          s=s.replace("DEPTH MATERIAL · '+V+' · 11/11","CHARACTER LIFE · '+V+' · 11/11")
          s=s.replace("process.env.TINVEST_BUILD='14.21.0'","process.env.TINVEST_BUILD='14.22.0'")
          s=s.replace("version:'14.21.0',build:'14.21.0',source:'figma-depth-material'","version:'14.22.0',build:'14.22.0',source:'figma-character-life'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text()
          x=x.replace("window.DNA_ART_PACK.version='14.21.0'","window.DNA_ART_PACK.version='14.22.0'")
          x=x.replace("window.DNA_ART_PACK.source='figma-depth-material'","window.DNA_ART_PACK.source='figma-character-life'")
          a.write_text(x)

          e=Path('public/dna-world-engine-v141.js'); x=e.read_text()
          x=x.replace("const V='14.21.0'","const V='14.22.0'")
          x=x.replace("DEPTH MATERIAL · v'+V+' · 11/11","CHARACTER LIFE · v'+V+' · 11/11")
          e.write_text(x)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/dna-art-scene-v148.js public/dna-world-engine-v141.js
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA character life v14.22.0"
          git push origin HEAD:dna-character-life-v14220
