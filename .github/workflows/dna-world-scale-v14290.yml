name: DNA world scale v14.29.0
on:
  push:
    branches: [dna-world-scale-v14290]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-world-scale-v14290
      - name: Wire world scale and preview
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.28.0 — DNA MOTION PASS: stronger readable work cycles, carts, crane and ambient motion; finance/history unchanged.','// v14.29.0 — DNA WORLD SCALE + LEVEL PREVIEW: global horizon, distant city/bridge and safe 1-11 preview controls; finance/history unchanged.')
          s=s.replace('dna-world-runtime-v14180)', 'dna-world-runtime-v14180|dna-level-preview-v14290)')
          s=s.replace('?rev=14280','?rev=14290')
          s=s.replace("runtime='<script src=\"/dna-world-runtime-v14180.js?rev=14290\"></script>',history=", "runtime='<script src=\"/dna-world-runtime-v14180.js?rev=14290\"></script>',preview='<script src=\"/dna-level-preview-v14290.js?rev=14290\"></script>',history=")
          s=s.replace("const V='v14.28.0'","const V='v14.29.0'")
          s=s.replace('|MOTION PASS/i','|MOTION PASS|WORLD SCALE/i')
          s=s.replace("MOTION PASS · '+V+' · 11/11","WORLD SCALE · '+V+' · 11/11")
          s=s.replace("history+art+assets+dna+runtime+versionLock", "history+art+assets+dna+runtime+preview+versionLock")
          s=s.replace("process.env.TINVEST_BUILD='14.28.0'","process.env.TINVEST_BUILD='14.29.0'")
          s=s.replace("version:'14.28.0',build:'14.28.0',source:'motion-pass'","version:'14.29.0',build:'14.29.0',source:'world-scale'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text()
          x=x.replace("window.DNA_ART_PACK.version='14.28.0'","window.DNA_ART_PACK.version='14.29.0'")
          x=x.replace("window.DNA_ART_PACK.source='motion-pass'","window.DNA_ART_PACK.source='world-scale'")
          if 'worldScaleOverlay' not in x:
              x=x.replace('})();',"window.DNA_ART_PACK.worldScaleOverlay='/assets/dna-world/l1/world-scale-v14290.svg?rev=14290';})();")
          a.write_text(x)

          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.28.0'","const VERSION='14.29.0'"); g.write_text(x)

          e=Path('public/dna-world-engine-v141.js'); x=e.read_text()
          x=x.replace("const V='14.28.0'","const V='14.29.0'")
          x=x.replace("['dnaWorld148','dnaWorldArt148','dnaQuality14200','dnaEnv14230','dnaDetail14240']", "['dnaWorld148','dnaWorldArt148','dnaWorldScale14290','dnaQuality14200','dnaEnv14230','dnaDetail14240']")
          anchor="art.src=(window.DNA_ART_PACK&&window.DNA_ART_PACK.sceneBase)||'/assets/dna-world/l1/figma-mobile-v14170.svg?rev=14170';h.appendChild(art);"
          insert=anchor+"\n const world=document.createElement('img');world.id='dnaWorldScale14290';world.alt='';world.decoding='async';world.src=(window.DNA_ART_PACK&&window.DNA_ART_PACK.worldScaleOverlay)||'/assets/dna-world/l1/world-scale-v14290.svg?rev=14290';Object.assign(world.style,{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'cover',zIndex:39.5,pointerEvents:'none',opacity:'.78',transformOrigin:'52% 44%',willChange:'transform,opacity'});h.appendChild(world);"
          x=x.replace(anchor,insert)
          x=x.replace("MOTION PASS · v'+V+' · 11/11","WORLD SCALE · v'+V+' · 11/11")
          e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text()
          x=x.replace("const V='14.28.0'","const V='14.29.0'")
          x=x.replace("function readLevel(){const root=document.getElementById('iwScene')?.parentElement||document.body;const m=(root.innerText||'').match(/(\\d+)\\s*\\/\\s*11/);return clamp(m?Number(m[1]):1,1,11)}", "function readLevel(){const preview=Number(window.DNA_PREVIEW_LEVEL||0);if(preview>=1&&preview<=11)return preview;const root=document.getElementById('iwScene')?.parentElement||document.body;const m=(root.innerText||'').match(/(\\d+)\\s*\\/\\s*11/);return clamp(m?Number(m[1]):1,1,11)}")
          x=x.replace("const env=document.getElementById('dnaEnv14230');if(env){const px=Math.sin(t*.12)*1.6,py=Math.cos(t*.09)*1.1;env.style.transform=`scale(1.012) translate(${px}px,${py}px)`;}", "const env=document.getElementById('dnaEnv14230');if(env){const px=Math.sin(t*.12)*1.6,py=Math.cos(t*.09)*1.1;env.style.transform=`scale(1.012) translate(${px}px,${py}px)`;}const world=document.getElementById('dnaWorldScale14290');if(world){const wx=Math.sin(t*.045)*2.8,wy=Math.cos(t*.035)*1.2;world.style.transform=`scale(1.018) translate(${wx}px,${wy}px)`;world.style.opacity=String(.62+Math.min(level,11)*.018);}")
          x=x.replace("buildTier:stage};}", "buildTier:stage,preview:!!window.DNA_PREVIEW_LEVEL,worldScale:'global'};}")
          r.write_text(x)
          PY
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-world-scale-v14290.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA world scale v14.29.0"
          git push origin HEAD:dna-world-scale-v14290
