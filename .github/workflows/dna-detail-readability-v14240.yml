name: DNA detail readability v14.24.0
on:
  push:
    branches: [dna-detail-readability-v14240]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-detail-readability-v14240
      - name: Wire detail readability pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.23.0 — DNA CINEMATIC ENVIRONMENT: depth, local light, foreground and parallax; finance/history unchanged.','// v14.24.0 — DNA DETAIL READABILITY: brighter underground, cleaner material detail and contrast; finance/history unchanged.')
          s=s.replace('?rev=14230','?rev=14240')
          s=s.replace("const V='v14.23.0'","const V='v14.24.0'")
          s=s.replace("CINEMATIC ENV · '+V+' · 11/11","DETAIL READABILITY · '+V+' · 11/11")
          s=s.replace("process.env.TINVEST_BUILD='14.23.0'","process.env.TINVEST_BUILD='14.24.0'")
          s=s.replace("version:'14.23.0',build:'14.23.0',source:'figma-cinematic-environment'","version:'14.24.0',build:'14.24.0',source:'figma-detail-readability'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text()
          x=x.replace("window.DNA_ART_PACK.version='14.23.0'","window.DNA_ART_PACK.version='14.24.0'")
          x=x.replace("window.DNA_ART_PACK.source='figma-cinematic-environment'","window.DNA_ART_PACK.source='figma-detail-readability'")
          if 'detailOverlay' not in x:
              x=x.replace("window.DNA_ART_PACK.environmentOverlay='/assets/dna-world/l1/cinematic-environment-v14230.svg?rev=14230';","window.DNA_ART_PACK.environmentOverlay='/assets/dna-world/l1/cinematic-environment-v14230.svg?rev=14230';window.DNA_ART_PACK.detailOverlay='/assets/dna-world/l1/detail-readability-v14240.svg?rev=14240';")
          a.write_text(x)

          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.23.0'","const VERSION='14.24.0'"); g.write_text(x)

          e=Path('public/dna-world-engine-v141.js'); x=e.read_text()
          x=x.replace("const V='14.23.0'","const V='14.24.0'")
          x=x.replace("['dnaWorld148','dnaWorldArt148','dnaQuality14200','dnaEnv14230']","['dnaWorld148','dnaWorldArt148','dnaQuality14200','dnaEnv14230','dnaDetail14240']")
          x=x.replace("zIndex:41,pointerEvents:'none',opacity:'.64'","zIndex:41,pointerEvents:'none',opacity:'.48'")
          x=x.replace("zIndex:42,pointerEvents:'none',opacity:'.90'","zIndex:42,pointerEvents:'none',opacity:'.72'")
          marker="h.appendChild(env);\n const c=document.createElement('canvas');"
          insert="h.appendChild(env);\n const detail=document.createElement('img');detail.id='dnaDetail14240';detail.alt='';detail.decoding='async';detail.src=(window.DNA_ART_PACK&&window.DNA_ART_PACK.detailOverlay)||'/assets/dna-world/l1/detail-readability-v14240.svg?rev=14240';Object.assign(detail.style,{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'cover',zIndex:42,pointerEvents:'none',opacity:'.86'});h.appendChild(detail);\n const c=document.createElement('canvas');"
          x=x.replace(marker,insert)
          x=x.replace("CINEMATIC ENV · v'+V+' · 11/11","DETAIL READABILITY · v'+V+' · 11/11")
          e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text().replace("const V='14.23.0'","const V='14.24.0'"); r.write_text(x)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/dna-art-scene-v148.js public/dna-game-assets-v147.js public/dna-world-engine-v141.js public/dna-world-runtime-v14180.js
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA detail readability v14.24.0"
          git push origin HEAD:dna-detail-readability-v14240
