name: Activate v8.2 Pixel World
on:
  push:
    paths:
      - '.github/workflows/activate-v820.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Restore full index and activate v8.2
        run: |
          git checkout HEAD~2 -- public/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          needle='<script src="/v800.js?v=8.1.0"></script></body></html>'
          repl='<script src="/v800.js?v=8.1.0"></script><script src="/v820.js?v=8.2.0"></script></body></html>'
          if needle not in s:
              raise SystemExit('activation needle not found')
          p.write_text(s.replace(needle,repl,1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m "activate v8.2 pixel world safely"
          git push