name: Activate v9.5 DNA living world
on:
  push:
    paths:
      - '.github/workflows/activate-v950.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production script tail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='<script src="/v940.js?v=9.4.1"></script><script src="/v841.js?v=8.4.1"></script>'
          new='<script src="/v940.js?v=9.4.1"></script><script src="/v950.js?v=9.5.0"></script><script src="/v841.js?v=8.4.1"></script>'
          if old not in s:
              raise SystemExit('expected v9.4.1 tail not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/v950.js
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git commit -m "activate v9.5 DNA living world"
          git push
