name: activate overview payout v7.16.6
on:
  push:
    paths: ['.github/workflows/activate-v7166.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check public/v7105.js
          python3 - <<'PY'
          p='public/index.html'
          s=open(p,encoding='utf-8').read()
          old='/v7105.js?v=7.16.5'
          new='/v7105.js?v=7.16.6'
          assert old in s
          s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.16.6 activate static overview payout'
          git push