name: v2 build

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-build.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
