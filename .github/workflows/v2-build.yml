name: v2 build

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'payouts-core.js'
      - 'payouts.js'
      - 'server-core.js'
      - 'production-v158.js'
      - 'production-v159.js'
      - 'production-v160.js'
      - '.github/workflows/v2-build.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'payouts-core.js'
      - 'payouts.js'
      - 'server-core.js'
      - 'production-v158.js'
      - 'production-v159.js'
      - 'production-v160.js'
      - '.github/workflows/v2-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:core
      - run: node --check ../payouts-core.js
      - run: node --check ../server-core.js
      - run: node --check ../production-v158.js
      - run: node --check ../production-v159.js
      - run: node --check ../production-v160.js
