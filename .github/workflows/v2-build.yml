name: v2 build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'v2/**'
      - 'payouts-core.js'
      - 'payouts.js'
      - 'server-core.js'
      - 'production-v158.js'
      - 'production-v159.js'
      - 'production-v160.js'
      - '.github/workflows/v2-build.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'v2/**'
      - 'payouts-core.js'
      - 'payouts.js'
      - 'server-core.js'
      - 'production-v158.js'
      - 'production-v159.js'
      - 'production-v160.js'
      - '.github/workflows/v2-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qvanix/v2-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package.json
      - run: npm install --no-audit --no-fund
      - name: TEMP commit generated v2 lockfile to branch
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- v2/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v2/package-lock.json
            git commit -m "QVANIX reliability · generate v2 lockfile"
            git push origin HEAD:qvanix/v2-lockfile
          fi
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Root runtime dependency security gate
        working-directory: .
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run test:core
      - run: node --check ../payouts-core.js
      - run: node --check ../server-core.js
      - run: node --check ../production-v158.js
      - run: node --check ../production-v159.js
      - run: node --check ../production-v160.js
