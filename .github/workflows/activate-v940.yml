name: Activate v9.4.1 DNA renderer
on:
  push:
    paths:
      - '.github/workflows/activate-v940.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='<script src="/v940.js?v=9.4.0"></script>'
          new='<script src="/v940.js?v=9.4.1"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('v940 script tag not found')
          p.write_text(s)
          PY
          node --check public/v940.js
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git diff --cached --quiet || git commit -m "activate v9.4.1 consolidated DNA renderer"
          git push
