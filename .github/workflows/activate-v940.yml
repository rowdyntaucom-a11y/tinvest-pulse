name: Activate v9.4 DNA renderer
on:
  push:
    paths:
      - '.github/workflows/activate-v940.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='<script src="/v930.js?v=9.3.2"></script><script src="/v841.js?v=8.4.1"></script>'
          new='<script src="/v940.js?v=9.4.0"></script><script src="/v841.js?v=8.4.1"></script>'
          if old not in s:
              raise SystemExit('expected v9.3 script tail not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/v940.js
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git commit -m "activate v9.4 consolidated DNA renderer"
          git push
