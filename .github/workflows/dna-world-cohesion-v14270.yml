name: DNA world cohesion v14.27.0
on:
  push:
    branches: [dna-world-cohesion-v14270]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-world-cohesion-v14270
      - name: Wire cohesion pass
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.26.0 — DNA CHARACTER MATERIAL: richer modular workers and carts, denser underground life; finance/history unchanged.','// v14.27.0 — DNA WORLD COHESION: environment-matched character lighting, contact shadows and underground life; finance/history unchanged.')
          s=s.replace('?rev=14260','?rev=14270')
          s=s.replace("const V='v14.26.0'","const V='v14.27.0'")
          s=s.replace("CHARACTER MATERIAL · '+V+' · 11/11","WORLD COHESION · '+V+' · 11/11")
          s=s.replace("|CHARACTER MATERIAL/i","|CHARACTER MATERIAL|WORLD COHESION/i")
          s=s.replace("process.env.TINVEST_BUILD='14.26.0'","process.env.TINVEST_BUILD='14.27.0'")
          s=s.replace("version:'14.26.0',build:'14.26.0',source:'character-material'","version:'14.27.0',build:'14.27.0',source:'world-cohesion'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text().replace("window.DNA_ART_PACK.version='14.26.0'","window.DNA_ART_PACK.version='14.27.0'").replace("window.DNA_ART_PACK.source='character-material'","window.DNA_ART_PACK.source='world-cohesion'"); a.write_text(x)
          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.26.0'","const VERSION='14.27.0'"); g.write_text(x)
          e=Path('public/dna-world-engine-v141.js'); x=e.read_text().replace("const V='14.26.0'","const V='14.27.0'").replace("CHARACTER MATERIAL · v'+V+' · 11/11","WORLD COHESION · v'+V+' · 11/11"); e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text()
          x=x.replace("const V='14.26.0'","const V='14.27.0'")
          old="function worker(key,x,feetY,w=70,h=104,flip=false,alpha=1,bob=0,angle=0){g.save();g.globalAlpha=.34;g.fillStyle='#000';g.beginPath();g.ellipse(x,feetY+3,w*.28,5.5,0,0,Math.PI*2);g.fill();g.restore();g.save();g.translate(x,feetY);g.rotate(angle);const ok=asset(key,-w/2,-h+bob,w,h,{flipX:flip,alpha});if(!ok){g.globalAlpha=alpha;g.fillStyle='#d89464';g.beginPath();g.arc(0,-h*.72,8,0,Math.PI*2);g.fill();g.fillStyle='#218d88';g.fillRect(-9,-h*.58,18,h*.42)}g.restore()}"
          new="function worker(key,x,feetY,w=70,h=104,flip=false,alpha=1,bob=0,angle=0){const underground=feetY>500;g.save();g.globalAlpha=underground?.42:.34;g.filter='blur(1.2px)';g.fillStyle='#000';g.beginPath();g.ellipse(x,feetY+4,w*.32,6.5,0,0,Math.PI*2);g.fill();g.restore();glow(x,feetY-h*.58,underground?17:14,underground?.045:.03,underground?'62,234,222':'255,184,94');g.save();g.translate(x,feetY);g.rotate(angle);g.filter=underground?'drop-shadow(0 3px 2px rgba(0,0,0,.55)) drop-shadow(0 0 3px rgba(57,231,220,.20))':'drop-shadow(0 3px 2px rgba(0,0,0,.48)) drop-shadow(0 0 2px rgba(255,191,106,.16))';const ok=asset(key,-w/2,-h+bob,w,h,{flipX:flip,alpha});if(!ok){g.globalAlpha=alpha;g.fillStyle='#d89464';g.beginPath();g.arc(0,-h*.72,8,0,Math.PI*2);g.fill();g.fillStyle='#218d88';g.fillRect(-9,-h*.58,18,h*.42)}g.restore()}"
          x=x.replace(old,new)
          anchor="function progression(level){const stage=Math.ceil(level/2);"
          add="function cohesion(t,level){g.save();const q=g.createLinearGradient(0,430,0,680);q.addColorStop(0,'rgba(5,17,18,0)');q.addColorStop(1,'rgba(0,7,8,.16)');g.fillStyle=q;g.fillRect(0,430,820,250);g.restore();[[286,365,'255,184,94'],[650,365,'255,175,86'],[154,636,'58,234,222'],[555,636,'58,234,222']].forEach((p,i)=>glow(p[0],p[1]-52,28,.028+.012*Math.sin(t*2+i),p[2]));g.save();g.globalAlpha=.8;g.fillStyle='#563724';g.fillRect(314,615,38,7);g.fillRect(318,604,30,7);g.fillStyle='#2c3b3b';g.beginPath();g.moveTo(348,620);g.lineTo(365,601);g.lineTo(383,620);g.closePath();g.fill();g.restore();if(level>=2){g.save();g.globalAlpha=.65;g.fillStyle='#7a5135';g.fillRect(478,604,30,20);g.strokeStyle='#bd8458';g.strokeRect(478,604,30,20);g.restore()}}\n"
          x=x.replace(anchor,add+anchor)
          x=x.replace("g.clearRect(0,0,820,680);growth(level);atmosphere(t,level);ambientLife(t,level);infrastructure(t,level);people(t,level);logistics(t,level);raf=requestAnimationFrame(frame)","g.clearRect(0,0,820,680);growth(level);atmosphere(t,level);cohesion(t,level);ambientLife(t,level);infrastructure(t,level);people(t,level);logistics(t,level);raf=requestAnimationFrame(frame)")
          r.write_text(x)
          PY
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-world-cohesion-v14270.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA world cohesion v14.27.0"
          git push origin HEAD:dna-world-cohesion-v14270
