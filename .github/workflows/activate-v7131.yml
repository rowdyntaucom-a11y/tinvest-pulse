name: activate v7.13.1 data integrity
on:
  push:
    paths: ['.github/workflows/activate-v7131.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          p='public/index.html';s=open(p,encoding='utf-8').read();needle='<script src="/v713.js?v=7.13.0"></script>';add=needle+'<script src="/v7131.js?v=7.13.1"></script>';assert needle in s
          if '/v7131.js?v=7.13.1' not in s:s=s.replace(needle,add,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          node --check public/v7131.js
          node --check bond-analytics.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.13.1 activate data integrity'
          git push