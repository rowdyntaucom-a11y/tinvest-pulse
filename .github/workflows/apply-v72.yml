name: Apply v7.2 True Payout Calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v72.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire payout API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          marker="app.get('/api/dashboard', async (req, res) => {"
          block="""// v7.2 — TRUE PAYOUT CALENDAR\nrequire('./payouts')(app, {\n  tbankRequest,\n  buildDashboard,\n  getAccounts,\n  selectAccount,\n  getOperations,\n  isIncomeOperation,\n  operationCash\n});\n\n"""
          if "require('./payouts')(app" not in s:
              if marker not in s:
                  raise SystemExit('dashboard route marker not found')
              s=s.replace(marker, block+marker, 1)
              p.write_text(s)
          PY
          cp server.js public/server.js
          node --check server.js
          node --check public/server.js
          node --check payouts.js
          node --check public/v72.js

      - name: Commit v7.2 backend wire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/server.js
          if git diff --cached --quiet; then
            echo 'No server changes needed'
          else
            git commit -m 'Wire v7.2 true payout calendar API'
            git push origin main
          fi
