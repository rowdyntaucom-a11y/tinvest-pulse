name: v7.10.8 cache bust
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "p='public/index.html';s=open(p).read();s=s.replace('/v7106.js?v=7.10.6','/v7106.js?v=7.10.8');open(p,'w').write(s)"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          if ! git diff --cached --quiet; then git commit -m 'v7.10.8 activate chart fix'; git push; fi
