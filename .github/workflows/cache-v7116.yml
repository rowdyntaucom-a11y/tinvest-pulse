name: v7.11.6 payout cache bust
on:
  push:
    paths:
      - '.github/workflows/cache-v7116.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump payout script cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='/v7105.js?v=7.11.2'
          new='/v7105.js?v=7.11.6'
          if old not in s: raise SystemExit('v7105 cache target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.11.6 activate payout resilience'
          git push
