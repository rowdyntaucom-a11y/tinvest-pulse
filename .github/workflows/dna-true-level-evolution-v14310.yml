name: DNA true level evolution v14.31.0
on:
  push:
    branches: [dna-true-level-evolution-v14310]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-true-level-evolution-v14310
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch build and wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace('|dna-level-worlds-v14300)', '|dna-level-worlds-v14300|dna-level-worlds-v14310)')
          s=s.replace('/dna-level-worlds-v14300.js?rev=14300','/dna-level-worlds-v14310.js?rev=14310')
          s=s.replace('rev=14300','rev=14310')
          s=s.replace('v14.30.0','v14.31.0').replace("TINVEST_BUILD='14.30.0'","TINVEST_BUILD='14.31.0'")
          s=s.replace("process.env.TINVEST_BUILD='14.30.0'","process.env.TINVEST_BUILD='14.31.0'")
          p.write_text(s)
          for f in ['public/dna-art-scene-v148.js','public/dna-game-assets-v147.js','public/dna-world-engine-v141.js','public/dna-world-runtime-v14180.js','public/dna-level-preview-v14290.js']:
              q=Path(f)
              if q.exists():
                  t=q.read_text().replace("14.30.0","14.31.0")
                  q.write_text(t)
          Path('.github/workflows/dna-true-level-evolution-v14310.yml').unlink()
          PY
          node --check public/dna-level-worlds-v14310.js
          node --check public/dna-world-engine-v141.js
          node --check public/dna-world-runtime-v14180.js
          node --check public/dna-level-preview-v14290.js
          node --check server.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'wire true DNA level evolution v14.31.0'
          git push
