name: Activate DNA World v9.3.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/activate-v930.yml'
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check module
        run: node --check public/v930.js
      - name: Remove conflicting DNA overlays and activate v9.3.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('<script src="/v910.js?v=9.1.0"></script>','')
          s=s.replace('<script src="/v920.js?v=9.2.0"></script>','')
          tag='<script src="/v930.js?v=9.3.2"></script>'
          if '/v930.js?' in s:
              s=re.sub(r'<script src="/v930\.js\?v=[^"]+"></script>',tag,s)
          else:
              if '</body>' not in s: raise SystemExit('body anchor missing')
              s=s.replace('</body>',tag+'\n</body>',1)
          if s.count(tag)!=1: raise SystemExit('v9.3.2 tag verify failed')
          if '/v910.js?' in s or '/v920.js?' in s: raise SystemExit('old DNA overlays still present')
          p.write_text(s)
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'activate DNA world v9.3.2 conflict fix'
          git push origin main
