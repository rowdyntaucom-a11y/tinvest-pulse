name: Strip Client DNA Formula

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shield-strip-client-dna.yml'

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace client DNA engine with server adapter
        shell: bash
        env:
          DNA_STUB_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          app = Path('public/app.js')
          text = app.read_text(encoding='utf-8')
          stub = base64.b64decode(os.environ['DNA_STUB_B64']).decode('utf-8')
          new, n = re.subn(r'function pulseStats\(d\)\{[\s\S]*?\n\}\nfunction drawPulsePath', stub, text, count=1)
          if n != 1:
              raise SystemExit('pulseStats block not found or ambiguous')
          app.write_text(new, encoding='utf-8')
          v74 = Path('public/v74.js')
          t = v74.read_text(encoding='utf-8')
          if 'window.__shieldDNA=x;' not in t:
              t, n = re.subn(r'function paint\(x\)\{', 'function paint(x){window.__shieldDNA=x;', t, count=1)
              if n != 1:
                  raise SystemExit('v74 paint hook not found')
              v74.write_text(t, encoding='utf-8')
          PY
          node --check public/app.js
          node --check public/v74.js
      - name: Commit sanitized client
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/v74.js
          git commit -m 'Shield: remove proprietary DNA formula from browser'
          git push
