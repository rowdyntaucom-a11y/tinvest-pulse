name: v7.12.4 cache bust
on:
  push:
    paths: ['.github/workflows/cache-v7124.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          p='public/index.html';s=open(p,encoding='utf-8').read();old='/v712.js?v=7.12.3';new='/v712.js?v=7.12.4';assert old in s;s=s.replace(old,new,1);open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/index.html
          git commit -m 'v7.12.4 cache bust'
          git push