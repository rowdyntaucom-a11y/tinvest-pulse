name: Activate Investor DNA v8.6
on:
  push:
    paths: ['public/v860.js']
  workflow_dispatch:
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node --check public/v860.js
      - name: Exact activation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          tag='<script src="/v860.js?v=8.6.0"></script>'
          anchor='<script src="/v850.js?v=8.5.0"></script>'
          if tag not in s:
            if s.count(anchor)!=1: raise SystemExit('SAFE ABORT: v850 anchor')
            s=s.replace(anchor,anchor+'\n'+tag,1); p.write_text(s)
          if p.read_text().count(tag)!=1: raise SystemExit('SAFE ABORT: v860 verify')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git diff --cached --quiet || (git commit -m 'activate v8.6 sprite world' && git push)
