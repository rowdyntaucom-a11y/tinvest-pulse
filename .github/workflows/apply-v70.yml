name: Apply v7.0 Portfolio DNA

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v70.patch.part*'
      - '.github/workflows/apply-v70.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply v7.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/v70.patch.part1 .deploy/v70.patch.part2 .deploy/v70.patch.part3 .deploy/v70.patch.part4 > /tmp/v70.patch.gz.b64
          base64 -d /tmp/v70.patch.gz.b64 | gzip -d > /tmp/v70.patch
          git apply --check /tmp/v70.patch
          git apply /tmp/v70.patch
          cp app.js public/app.js
          cp index.html public/index.html
          cp server.js public/server.js
          cp style.css public/style.css
          node --check app.js
          node --check server.js
          node --check public/app.js
          node --check public/server.js

      - name: Commit v7.0
        shell: bash
        run: |
          set -euo pipefail
          rm -f .deploy/v70.patch.part1 .deploy/v70.patch.part2 .deploy/v70.patch.part3 .deploy/v70.patch.part4
          rmdir .deploy 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy v7.0 Portfolio DNA'
          git push origin main
