name: Fix DNA v14.15 consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dna-v14150-consistency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align badge and master status path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace("CHARACTERS · '+V+' · 5/11", "CHARACTERS · '+V+' · 6/11")
          s=s.replace("path:'/assets/dna-world/l1/figma-master-v14150.svg'", "path:'/assets/dna-world/l1/figma-master-v14140.svg'")
          p.write_text(s)
          PY
          rm .github/workflows/fix-dna-v14150-consistency.yml
      - name: Commit consistency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js .github/workflows/fix-dna-v14150-consistency.yml
          git diff --cached --check
          git commit -m 'fix DNA v14.15 production consistency'
          git push origin HEAD:main
