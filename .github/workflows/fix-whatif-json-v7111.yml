name: v7.11.1 WHAT IF JSON hardening
on:
  push:
    paths:
      - '.github/workflows/fix-whatif-json-v7111.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WHAT IF fetch handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v77.js')
          s=p.read_text()
          old="const q=new URLSearchParams({contribution,marketShock,rateShift,target,duration});const r=await fetch('/api/shield/whatif?'+q,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d?.error||'WHAT IF API error');"
          new="const q=new URLSearchParams({contribution,marketShock,rateShift,target,duration});const r=await fetch('/api/shield/whatif?'+q,{cache:'no-store'}),raw=await r.text();let d;try{d=JSON.parse(raw)}catch(_){throw new Error('Сервер вернул не JSON · HTTP '+r.status)}if(!r.ok)throw new Error(d?.error||('WHAT IF API · HTTP '+r.status));"
          assert old in s, 'WHAT IF fetch target not found'
          s=s.replace(old,new,1)
          s=s.replace('SCENARIO ENGINE · v7.10.9','SCENARIO ENGINE · v7.11.1')
          s=s.replace('SERVER_WHAT_IF · v7.10.9','SERVER_WHAT_IF · v7.11.1')
          p.write_text(s)

          p=Path('public/index.html')
          s=p.read_text()
          import re
          ms=list(re.finditer(r'/v77\.js\?v=[^"\']+',s))
          assert ms, 'v77 cache ref not found'
          m=ms[-1]
          s=s[:m.start()]+'/v77.js?v=7.11.1'+s[m.end():]
          p.write_text(s)
          PY
          node --check public/v77.js
          node --check whatif-engine.js
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/v77.js public/index.html
          git commit -m 'v7.11.1 harden WHAT IF JSON handling'
          git push
