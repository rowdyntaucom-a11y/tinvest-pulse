name: DNA motion pass v14.28.0
on:
  push:
    branches: [dna-motion-pass-v14280]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-motion-pass-v14280
      - name: Wire motion pass
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('server.js'); s=p.read_text()
          s=s.replace('// v14.27.0 — DNA WORLD COHESION: environment-matched character lighting, contact shadows and underground life; finance/history unchanged.','// v14.28.0 — DNA MOTION PASS: stronger readable work cycles, carts, crane and ambient motion; finance/history unchanged.')
          s=s.replace('?rev=14270','?rev=14280')
          s=s.replace("const V='v14.27.0'","const V='v14.28.0'")
          s=s.replace("WORLD COHESION · '+V+' · 11/11","MOTION PASS · '+V+' · 11/11")
          s=s.replace("|WORLD COHESION/i","|WORLD COHESION|MOTION PASS/i")
          s=s.replace("process.env.TINVEST_BUILD='14.27.0'","process.env.TINVEST_BUILD='14.28.0'")
          s=s.replace("version:'14.27.0',build:'14.27.0',source:'world-cohesion'","version:'14.28.0',build:'14.28.0',source:'motion-pass'")
          p.write_text(s)

          a=Path('public/dna-art-scene-v148.js'); x=a.read_text().replace("window.DNA_ART_PACK.version='14.27.0'","window.DNA_ART_PACK.version='14.28.0'").replace("window.DNA_ART_PACK.source='world-cohesion'","window.DNA_ART_PACK.source='motion-pass'"); a.write_text(x)
          g=Path('public/dna-game-assets-v147.js'); x=g.read_text().replace("const VERSION='14.27.0'","const VERSION='14.28.0'"); g.write_text(x)
          e=Path('public/dna-world-engine-v141.js'); x=e.read_text().replace("const V='14.27.0'","const V='14.28.0'").replace("WORLD COHESION · v'+V+' · 11/11","MOTION PASS · v'+V+' · 11/11"); e.write_text(x)

          r=Path('public/dna-world-runtime-v14180.js'); x=r.read_text()
          x=x.replace("const V='14.27.0'","const V='14.28.0'")
          old="function drawCart(x,baseY,loaded=true,alpha=.98,scale=1){const w=88*scale,h=58*scale;g.save();g.globalAlpha=.22;g.fillStyle='#000';g.beginPath();g.ellipse(x,baseY+4,w*.38,5*scale,0,0,Math.PI*2);g.fill();g.restore();if(asset(loaded?'cartLoaded':'cartEmpty',x-w/2,baseY-h*.8,w,h,{alpha}))return;g.save();g.globalAlpha=alpha;g.fillStyle='#965a36';g.fillRect(x-w*.38,baseY-h*.55,w*.76,h*.42);g.fillStyle='#11191a';for(const dx of[-w*.22,w*.22]){g.beginPath();g.arc(x+dx,baseY,7*scale,0,Math.PI*2);g.fill()}g.restore()}"
          new="function drawCart(x,baseY,loaded=true,alpha=.98,scale=1,phase=0){const w=88*scale,h=58*scale,bounce=Math.sin(phase)*1.6,y=baseY+bounce;g.save();g.globalAlpha=.24;g.filter='blur(.8px)';g.fillStyle='#000';g.beginPath();g.ellipse(x,y+5,w*.4,5.5*scale,0,0,Math.PI*2);g.fill();g.restore();const ok=asset(loaded?'cartLoaded':'cartEmpty',x-w/2,y-h*.8,w,h,{alpha});if(!ok){g.save();g.globalAlpha=alpha;g.fillStyle='#965a36';g.fillRect(x-w*.38,y-h*.55,w*.76,h*.42);g.restore()}g.save();g.globalCompositeOperation='screen';for(const dx of[-w*.26,w*.26]){const a=phase*1.8;g.fillStyle='rgba(198,255,246,.52)';g.beginPath();g.arc(x+dx+Math.cos(a)*3*scale,y+1+Math.sin(a)*3*scale,1.6*scale,0,Math.PI*2);g.fill()}g.restore()}"
          x=x.replace(old,new)

          old="function infrastructure(t,level){const lift=225+Math.sin(t*(.7+level*.02))*31;g.strokeStyle='rgba(214,169,103,.92)';g.lineWidth=2;g.beginPath();g.moveTo(548,145);g.lineTo(548,lift);g.stroke();g.fillStyle='#83502e';g.strokeStyle='#d39a5b';g.lineWidth=2;g.fillRect(536,lift,24,16);g.strokeRect(536,lift,24,16);glow(548,lift+8,25,.09,'255,190,92');[[221,479],[514,479],[764,479]].forEach((p,i)=>glow(p[0],p[1],32,.09+.06*Math.sin(t*(2.2+level*.03)+i),'255,186,78'));[[96,572],[118,582],[493,570],[515,581],[688,575]].forEach((p,i)=>glow(p[0],p[1],19,.05+.035*Math.sin(t*3+i),'54,236,226'))}"
          new="function infrastructure(t,level){const cycle=(Math.sin(t*(.78+level*.02)-.8)+1)/2,ease=cycle*cycle*(3-2*cycle),lift=206+ease*64,hookX=548+Math.sin(t*1.35)*3.5;g.strokeStyle='rgba(214,169,103,.94)';g.lineWidth=2.2;g.beginPath();g.moveTo(548,145);g.lineTo(hookX,lift);g.stroke();g.save();g.translate(hookX,lift);g.rotate(Math.sin(t*1.7)*.035);g.fillStyle='#83502e';g.strokeStyle='#d39a5b';g.lineWidth=2;g.fillRect(-12,0,24,16);g.strokeRect(-12,0,24,16);g.restore();glow(hookX,lift+8,27,.11+.025*Math.sin(t*2.1),'255,190,92');[[221,479],[514,479],[764,479]].forEach((p,i)=>glow(p[0],p[1],35,.10+.075*Math.sin(t*(2.2+level*.03)+i),'255,186,78'));[[96,572],[118,582],[493,570],[515,581],[688,575]].forEach((p,i)=>glow(p[0],p[1],21,.06+.045*Math.sin(t*3.2+i),'54,236,226'))}"
          x=x.replace(old,new)

          x=x.replace("const mineBob=Math.sin(t*5.2)*1.6;worker('minerMine',286,365,78,112,false,1,mineBob,Math.sin(t*5.2)*.035);spark(260,328,t,0);","const mineSwing=Math.sin(t*4.9);worker('minerMine',286,365,78,112,false,1,Math.abs(mineSwing)*2.4,-.075+mineSwing*.12);spark(258,326,t,0);")
          x=x.replace("worker('builderWork',650,365,76,110,false,1,Math.sin(t*4.4+1)*1.3,-Math.sin(t*4.4+1)*.022);spark(676,321,t,1.2,'255,170,82');","const buildSwing=Math.sin(t*4.1+1);worker('builderWork',650,365,76,110,false,1,Math.abs(buildSwing)*1.8,buildSwing*.065);spark(676,321,t,1.2,'255,170,82');")
          x=x.replace("const run=(t*(13+level*.9))%150,hx=390+run;worker('haulerWalk',hx,365,72,105,false,.98,Math.sin(t*7)*2.1,Math.sin(t*7)*.016);","const run=(t*(16+level*1.1))%170,hx=375+run,step=Math.sin(t*8.2);worker('haulerWalk',hx,365,72,105,false,.98,Math.abs(step)*3.2,step*.04);g.save();g.globalAlpha=.07+.04*Math.abs(step);g.fillStyle='#c4d9d3';g.beginPath();g.ellipse(hx-13,367,6+4*Math.abs(step),2.4,0,0,Math.PI*2);g.fill();g.restore();")
          x=x.replace("worker('minerMine',154,636,76,108,true,.98,Math.sin(t*5+2)*1.6,-Math.sin(t*5+2)*.03);spark(185,598,t,2.1,'74,241,226');","const deepSwing=Math.sin(t*4.7+2);worker('minerMine',154,636,76,108,true,.98,Math.abs(deepSwing)*2.3,.07-deepSwing*.11);spark(185,598,t,2.1,'74,241,226');")
          x=x.replace("for(let i=0;i<count;i++){const x=-55+((t*speed+i*(820/count+120))%960);drawCart(x,388,i%2===0,.99,1.07)}","for(let i=0;i<count;i++){const x=-55+((t*speed+i*(820/count+120))%960);drawCart(x,388,i%2===0,.99,1.07,t*7+i*.9)}")
          x=x.replace("for(let i=0;i<undergroundCount;i++){const ux=875-((t*(22+level*1.8)+i*470)%970);drawCart(ux,640,true,.94,.98)}","for(let i=0;i<undergroundCount;i++){const ux=875-((t*(24+level*2)+i*470)%970);drawCart(ux,640,true,.94,.98,t*6.2+i*1.4)}")
          x=x.replace("function ambientLife(t,level){g.save();for(let i=0;i<3;i++){","function ambientLife(t,level){g.save();for(let i=0;i<5;i++){")
          x=x.replace("g.globalAlpha=(1-age)*.12;","g.globalAlpha=(1-age)*.17;")
          x=x.replace("workers:5+(level>=3)+(level>=4)+(level>=6)+(level>=8)","workers:5+(level>=3)+(level>=4)+(level>=6)+(level>=8),motion:'active'")
          r.write_text(x)
          PY
      - name: Remove transient workflow and commit
        run: |
          git rm .github/workflows/dna-motion-pass-v14280.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wire DNA motion pass v14.28.0"
          git push origin HEAD:dna-motion-pass-v14280
