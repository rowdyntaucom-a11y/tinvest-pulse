name: Activate v9.7 living world
on:
  push:
    paths:
      - '.github/workflows/activate-v970.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bust v9.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html'); s=p.read_text()
          old='<script src="/v960.js?v=9.6.1"></script>'
          new='<script src="/v960.js?v=9.7.0"></script>'
          if old not in s: raise SystemExit('v9.6.1 script not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/v960.js
      - name: Commit activation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git commit -m "activate v9.7 living world"
          git push
