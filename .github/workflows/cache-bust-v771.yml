name: Cache Bust WHAT IF v7.7.1

on:
  push:
    paths:
      - '.github/workflows/cache-bust-v771.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/v77.js?v=7.7"></script>'
          new='<script src="/v77.js?v=7.7.1"></script>'
          if old not in s:
              raise SystemExit('Expected v7.7 script tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'v7.7.1 cache bust WHAT IF'
          git push
